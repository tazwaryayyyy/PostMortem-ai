# Rate-limiting zones (declared at http-context scope via conf.d include)
limit_req_zone $binary_remote_addr zone=investigate:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m    rate=10r/m;

server {
    listen 80;
    server_name _;

    # Support large base64 screenshot payloads in SSE GET query strings
    large_client_header_buffers 4 256k;
    client_max_body_size        20m;

    # Increase timeout for SSE streaming investigations
    proxy_read_timeout    600s;
    proxy_connect_timeout 30s;
    proxy_send_timeout    600s;

    # SSE-specific settings
    proxy_buffering       off;
    proxy_cache           off;

    # Rate-limited: investigation SSE endpoint
    location /investigate {
        limit_req zone=investigate burst=3 nodelay;
        proxy_pass         http://postmortem-ai:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        chunked_transfer_encoding on;
    }

    # Rate-limited: PagerDuty webhook
    location /webhook/pagerduty {
        limit_req zone=webhook burst=5 nodelay;
        proxy_pass         http://postmortem-ai:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location / {
        proxy_pass         http://postmortem-ai:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Required for EventSource / SSE
        chunked_transfer_encoding on;
    }
}
