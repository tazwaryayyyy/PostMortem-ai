version: "3.9"

services:
  postmortem-ai:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - VULTR_DEPLOYMENT=true
    ports:
      - "8000:8000"
    volumes:
      - incidents_data:/app/incidents
      - db_data:/app
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - postmortem-ai

volumes:
  incidents_data:
  db_data:
